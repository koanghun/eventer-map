version: '3.8'

services:
  db:
    image: postgres:15
    container_name: eventer-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password is required}
      POSTGRES_DB: ${POSTGRES_DB:-eventer_db}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - eventer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventer-backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-eventer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eventer_db}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-7773}:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - eventer-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
        - REACT_APP_GOOGLE_MAPS_API_KEY=${REACT_APP_GOOGLE_MAPS_API_KEY}
    container_name: eventer-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-7772}:80"
    depends_on:
      - backend
    networks:
      - eventer-network

  # [Tool] 추출기 수동 실행용
  # 사용 명령어: docker-compose -f docker-compose.pro.yml run --rm event-extractor
  event-extractor:
    build:
      context: ./event-extractor
      dockerfile: Dockerfile
    container_name: eventer-extractor
    profiles:
      - tools
    env_file:
      - .env
    volumes:
      - ./event-extractor/credentials.json:/app/credentials.json
      - ./event-extractor/token.json:/app/token.json
      # 필요 시 로컬 LLM 통신을 위한 네트워크 공유
    networks:
      - eventer-network
    depends_on:
      - backend

networks:
  eventer-network:
    driver: bridge

volumes:
  postgres_data:
