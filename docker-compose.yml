version: '3.8'

services:
  # ============================================
  # OpenSSH Server - VSCode Remote 개발 환경 (선택사항)
  # Ubuntu 22.04 기반 (glibc 지원, VSCode Remote SSH 호환)
  # 사용: docker-compose --profile ssh up -d
  # ============================================
  openssh-server:
    image: ubuntu:22.04
    container_name: eventer-map-ssh
    profiles: ["ssh"]  # 선택적으로만 실행
    ports:
      - "${SSH_PORT:-7774}:22"
    environment:
      - USER_PASSWORD=${USER_PASSWORD:-changeme}
      - PUBLIC_KEY=${PUBLIC_KEY:-}
    volumes:
      # 프로젝트 전체를 developer 홈 디렉토리에 마운트
      - ./:/home/developer/eventer-map:rw
    restart: unless-stopped
    networks:
      - eventer-network
    command: |
      bash -c "
      # 1. 패키지 업데이트 및 필수 도구 설치
      apt-get update && 
      apt-get install -y openssh-server sudo curl wget git vim nano && 
      
      # 2. SSH 서비스 디렉토리 생성 (Ubuntu 22.04 필수)
      mkdir -p /run/sshd && 
      
      # 3. developer 사용자 생성
      #    -m: 홈 디렉토리 생성
      #    -s /bin/bash: 기본 쉘을 bash로 설정
      useradd -m -s /bin/bash developer && 
      
      # 4. 비밀번호 설정 (환경 변수에서 가져옴, 기본값: changeme)
      echo \"developer:\$$USER_PASSWORD\" | chpasswd && 
      
      # 5. sudo 권한 부여 (비밀번호 없이 sudo 사용 가능)
      echo 'developer ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers && 
      
      # 6. SSH 공개키 설정 (.ssh 디렉토리 생성)
      mkdir -p /home/developer/.ssh && 
      
      # 7. 공개키가 있으면 authorized_keys에 추가 (비밀번호 없이 접속 가능)
      if [ -n \"\$$PUBLIC_KEY\" ]; then 
        echo \"\$$PUBLIC_KEY\" > /home/developer/.ssh/authorized_keys && 
        chmod 600 /home/developer/.ssh/authorized_keys; 
      fi && 
      
      # 8. .ssh 디렉토리 권한 설정 (보안상 중요)
      chown -R developer:developer /home/developer/.ssh && 
      chmod 700 /home/developer/.ssh && 
      
      # 9. 프로젝트 디렉토리 권한 설정
      chown -R developer:developer /home/developer/eventer-map && 
      
      # 10. SSH 서비스 시작
      /usr/sbin/sshd -D
      "

  # ============================================
  # Backend - FastAPI
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventer-map-backend
    ports:
      - "${BACKEND_PORT:-7773}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/eventer.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:7772,http://localhost}
    volumes:
      # 데이터 영속성
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eventer-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Frontend - React + Nginx
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:7773}
        - REACT_APP_GOOGLE_MAPS_API_KEY=${REACT_APP_GOOGLE_MAPS_API_KEY}
    container_name: eventer-map-frontend
    ports:
      - "${FRONTEND_PORT:-7772}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - eventer-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend-data:
    driver: local

networks:
  eventer-network:
    driver: bridge
