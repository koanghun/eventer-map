name: Deploy to AWS (SAM + S3/CloudFront)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  STACK_NAME: eventer-map-stack

jobs:
  deploy-backend:
    name: Build & Deploy Backend (SAM)
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.stack-outputs.outputs.api_url }}
      s3_bucket: ${{ steps.stack-outputs.outputs.s3_bucket }}
      cf_dist_id: ${{ steps.stack-outputs.outputs.cf_dist_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build & Deploy SAM Stack
        working-directory: backend
        env:
          STAGE: prod
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
          COOKIE_SAMESITE: ${{ secrets.COOKIE_SAMESITE || 'None' }}
        run: make deploy STACK_NAME=${{ env.STACK_NAME }} AWS_REGION=${{ env.AWS_REGION }}

      - name: Export CloudFormation Outputs
        id: stack-outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='EventerMapApi'].OutputValue" --output text)
          S3_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          CF_DIST_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "s3_bucket=$S3_BUCKET" >> "$GITHUB_OUTPUT"
          echo "cf_dist_id=$CF_DIST_ID" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Build & Deploy Frontend (S3 + CloudFront)
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Dependencies & Build Frontend
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || needs.deploy-backend.outputs.api_url }}
          REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Sync Static Assets to S3 & Invalidate CloudFront
        env:
          S3_BUCKET: ${{ needs.deploy-backend.outputs.s3_bucket }}
          CF_DIST_ID: ${{ needs.deploy-backend.outputs.cf_dist_id }}
        run: |
          aws s3 sync frontend/build/ "s3://$S3_BUCKET" --delete \
            --exclude "index.html" --exclude "asset-manifest.json" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/build/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"
          if [ -f frontend/build/asset-manifest.json ]; then
            aws s3 cp frontend/build/asset-manifest.json "s3://$S3_BUCKET/asset-manifest.json" \
              --cache-control "no-cache, no-store, must-revalidate"
          fi
          aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "/index.html" "/"
