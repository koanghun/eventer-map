version: '3.8'

services:
  # ============================================
  # OpenSSH Server - WSL/원격 개발 환경 지원
  # ============================================
  openssh-server:
    image: linuxserver/openssh-server:latest
    container_name: eventer-map-ssh
    ports:
      - "7774:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      - USER_NAME=developer
      - SUDO_ACCESS=true
    volumes:
      # 프로젝트 전체를 개발자 홈 디렉토리에 마운트
      - ./:/home/developer/eventer-map:rw
    restart: unless-stopped
    networks:
      - eventer-network

  # ============================================
  # Backend - 개발 환경 (Python/FastAPI)
  # ============================================
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventer-map-backend-dev
    ports:
      - "${BACKEND_PORT:-7773}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/eventer.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:7772,http://localhost}
    volumes:
      # 개발 모드: 소스 코드 실시간 반영
      - ./backend:/app:rw
      # 데이터 영속성
      - backend-data:/app/data
    # 개발 모드: uvicorn --reload 사용
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s      # 개발 환경: 체크 간격 완화
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eventer-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Frontend - 개발 환경 (React)
  # ============================================
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
        - REACT_APP_GOOGLE_MAPS_API_KEY=${REACT_APP_GOOGLE_MAPS_API_KEY}
    container_name: eventer-map-frontend-dev
    ports:
      - "${FRONTEND_PORT:-7772}:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:7773}
      - REACT_APP_GOOGLE_MAPS_API_KEY=${REACT_APP_GOOGLE_MAPS_API_KEY}
    volumes:
      # 개발 모드: 소스 코드 실시간 반영
      - ./frontend/src:/app/src:rw
      - ./frontend/public:/app/public:rw
      # node_modules는 컨테이너 내부 것 사용 (성능 최적화)
    depends_on:
      backend-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eventer-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend-data:
    driver: local

networks:
  eventer-network:
    driver: bridge
