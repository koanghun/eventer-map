openapi: 3.0.3
info:
  title: Eventer Map API
  version: 1.0.0
paths:
  /ping:
    get:
      summary: 서버 상태 확인
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /auth/google:
    post:
      summary: 구글 로그인
      description: 구글 ID 토큰을 검증하고 자체 JWT(Access, Refresh) 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: 인증 성공
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly 리프레시 토큰
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: 인증 실패 (유효하지 않은 구글 토큰)
  /auth/refresh:
    post:
      summary: 액세스 토큰 갱신
      description: 유효한 리프레시 토큰을 사용하여 새로운 액세스 토큰 발급
      parameters:
        - in: cookie
          name: refreshToken
          schema:
            type: string
          required: true
          description: HttpOnly 리프레시 토큰
      responses:
        "200":
          description: 토큰 갱신 성공
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly 리프레시 토큰
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: 인증 실패 (유효하지 않은 리프레시 토큰)
  /auth/signup:
    post:
      summary: 로컬 회원가입
      description: 이메일과 비밀번호를 사용하여 새로운 사용자 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 회원가입 및 인증 성공
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly 리프레시 토큰
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: 잘못된 요청(이메일 중복 또는 데이터 누락)
  /auth/login:
    post:
      summary: 로컬 로그인
      description: 이메일과 비밀번호를 사용하여 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
      responses:
        "200":
          description: 인증 성공
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly 리프레시 토큰
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: 인증 실패 (잘못된 자격 증명)
  /users/me/link-google:
    post:
      summary: 구글 계정 연동
      description: 현재 로그인된 사용자의 계정에 구글 계정 연동
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkGoogleRequest"
      responses:
        "200":
          description: 구글 계정 연동 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: 잘못된 요청이거나 이미 연동됨
        "401":
          description: 인증 실패 (유효하지 않은 JWT 또는 구글 토큰)
  /auth/logout:
    post:
      summary: 로그아웃
      description: 데이터베이스에서 리프레시 토큰 무효화
      parameters:
        - in: cookie
          name: refreshToken
          schema:
            type: string
          required: true
          description: 무효화할 리프레시 토큰
      responses:
        "200":
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 쿠키 삭제 (Max-Age=0)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  schemas:
    GoogleLoginRequest:
      type: object
      required:
        - idToken
      properties:
        idToken:
          type: string
          description: 클라이언트로부터 전달받은 구글 ID 토큰
    TokenResponse:
      type: object
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          description: 애플리케이션 액세스 토큰 (JWT)
    SignupRequest:
      type: object
      required:
        - email
        - password
        - nickname
      properties:
        email:
          type: string
          format: email
          description: 사용자의 이메일 주소
        password:
          type: string
          format: password
          description: 사용자의 비밀번호
        nickname:
          type: string
          description: 사용자가 선택한 표시 이름(닉네임)
    LocalLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: 사용자의 이메일 주소
        password:
          type: string
          format: password
          description: 사용자의 비밀번호
    LinkGoogleRequest:
      type: object
      required:
        - idToken
      properties:
        idToken:
          type: string
          description: 클라이언트로부터 전달받은 구글 ID 토큰

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
