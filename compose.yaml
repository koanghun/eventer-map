version: '3.8'

services:
  # ============================================
  # OpenSSH Server - VSCode Remote 개발 환경 (선택사항)
  # Ubuntu 22.04 기반 (glibc 지원, VSCode Remote SSH 호환)
  # 사용: docker-compose --profile ssh up -d
  # ============================================
  openssh-server:
    build:
      context: ./openssh
      dockerfile: Dockerfile
    container_name: eventer-map-ssh
    profiles: ["ssh"]  # 선택적으로만 실행
    ports:
      - "${SSH_PORT:-7774}:22"
    environment:
      - USER_PASSWORD=${USER_PASSWORD:-changeme}
      - PUBLIC_KEY=${PUBLIC_KEY:-}
      - SSH_PORT=${SSH_PORT:-7774}  # 로그 출력용
    volumes:
      # 프로젝트 전체를 developer 홈 디렉토리에 마운트
      - ./:/home/developer/eventer-map:rw
    restart: unless-stopped
    networks:
      - eventer-network

  # ============================================
  # Backend - FastAPI (개발 모드 + SSH)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: eventer-map-backend-dev
    ports:
      - "${BACKEND_PORT:-65105}:8000"
      - "${BACKEND_SSH_PORT:-65107}:22"  # SSH 포트
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/eventer.db}
      # CORS: .env에서 NAS IP 설정 필요 (예: http://192.168.1.100:7772)
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      # SSH 설정
      - USER_PASSWORD=${USER_PASSWORD:-changeme}
      - PUBLIC_KEY=${PUBLIC_KEY:-}
    volumes:
      # 코드 Hot Reload를 위한 볼륨 마운트
      - ./backend:/app:rw
      # 데이터 영속성
      - backend-data:/app/data
    restart: unless-stopped
    networks:
      - eventer-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Frontend - React 개발 서버 (Hot Reload + SSH)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: eventer-map-frontend-dev
    ports:
      - "${FRONTEND_PORT:-65104}:3000"
      - "${FRONTEND_SSH_PORT:-65106}:22"  # SSH 포트
    environment:
      # API URL: .env에서 설정 (예: http://192.168.1.100:7773 또는 /api)
      # - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_GOOGLE_MAPS_API_KEY=${REACT_APP_GOOGLE_MAPS_API_KEY}
      - CHOKIDAR_USEPOLLING=true  # Hot reload를 위한 설정
      - WDS_SOCKET_PORT=0  # WebSocket 포트 자동 설정
      # SSH 설정
      - USER_PASSWORD=${USER_PASSWORD:-changeme}
      - PUBLIC_KEY=${PUBLIC_KEY:-}
    volumes:
      # 코드 Hot Reload를 위한 볼륨 마운트
      - ./frontend:/app:rw
      # node_modules는 컨테이너 내부 것 사용 (성능 향상)
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - eventer-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stdin_open: true  # React 개발 서버를 위해 필요
    tty: true

volumes:
  backend-data:
    driver: local

networks:
  eventer-network:
    driver: bridge
