AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  eventer-map-stack
  Serverless Backend (Lambda + API Gateway) & Frontend Static Hosting (S3 + CloudFront OAC)

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment stage

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: PostgreSQL connection string (e.g., postgres://user:pass@nas-host:port/dbname?sslmode=require&connect_timeout=5)

  JwtSecret:
    Type: String
    NoEcho: true
    Description: Secret key used to sign JWT access and refresh tokens

  CorsOrigins:
    Type: String
    Default: ""
    Description: Comma-separated allowed CORS origins (e.g., https://d12345.cloudfront.net,https://eventermap.com)

  CookieDomain:
    Type: String
    Default: ""
    Description: Optional cookie domain (e.g., .eventermap.com)

  CookieSameSite:
    Type: String
    Default: "None"
    AllowedValues:
      - Lax
      - None
      - Strict
    Description: SameSite attribute for refreshToken cookie (use None when CloudFront and API Gateway use separate domains, Lax when sharing root domain)

  # TODO(security): migrate sensitive parameters (DatabaseUrl, JwtSecret, XClientSecret) to AWS Secrets Manager or SSM SecureString
  XClientId:
    Type: String
    Default: ""
    Description: X (Twitter) OAuth 2.0 Client ID

  XClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: X (Twitter) OAuth 2.0 Client Secret

  XRedirectUri:
    Type: String
    Default: ""
    Description: X (Twitter) OAuth 2.0 Callback URL (e.g., https://eventer-map.com/auth/x/callback)

  XRequestEmail:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Request users.email scope during X OAuth when enabled in X Developer Portal

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: provided.al2023
    Architectures:
      - arm64

Resources:
  # ============================================================================
  # 1. Backend: Go Serverless Function (Lambda + API Gateway)
  # ============================================================================
  EventerMapApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build
      Handler: bootstrap
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt OAuthStatesTable.Arn
      Environment:
        Variables:
          ENV: !Ref Stage
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET: !Ref JwtSecret
          CORS_ORIGINS: !Ref CorsOrigins
          COOKIE_DOMAIN: !Ref CookieDomain
          COOKIE_SAMESITE: !Ref CookieSameSite
          S3_MEDIA_BUCKET: !Ref MediaBucket
          DYNAMODB_OAUTH_STATE_TABLE: !Ref OAuthStatesTable
          X_CLIENT_ID: !Ref XClientId
          X_CLIENT_SECRET: !Ref XClientSecret
          X_REDIRECT_URI: !Ref XRedirectUri
          X_REQUEST_EMAIL: !Ref XRequestEmail
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootPath:
          Type: Api
          Properties:
            Path: /
            Method: ANY
    Metadata:
      BuildMethod: makefile

  # ============================================================================
  # 1-1. Media Storage: S3 Bucket for Uploaded Images (Artist Profiles, Posters)
  # ============================================================================
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowPublicReadArtistProfiles
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/artists/profiles/*"

  # ============================================================================
  # 1-2. OAuth State Store: DynamoDB Table for Short-Lived PKCE & CSRF States
  # ============================================================================
  OAuthStatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: state_hash
          AttributeType: S
      KeySchema:
        - AttributeName: state_hash
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # ============================================================================
  # 2. Frontend: S3 Bucket (Private) + CloudFront (OAC)
  # ============================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Eventer Map Frontend (${Stage})"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed-CachingOptimized policy ID
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # SPA Routing: serve index.html on 403/404 from S3
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  EventerMapApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  MediaBucketName:
    Description: "S3 Bucket Name for Uploaded Media Files"
    Value: !Ref MediaBucket

  FrontendBucketName:
    Description: "S3 Bucket Name for Frontend Static Files"
    Value: !Ref FrontendBucket

  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID for Cache Invalidation"
    Value: !Ref FrontendDistribution

  FrontendUrl:
    Description: "CloudFront Frontend URL"
    Value: !Sub "https://${FrontendDistribution.DomainName}"
