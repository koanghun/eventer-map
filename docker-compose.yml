version: '3.8'

services:
  # ============================================
  # OpenSSH Server - 원격 개발 환경 (선택사항)
  # 사용: docker-compose --profile ssh up -d
  # ============================================
  openssh-server:
    image: linuxserver/openssh-server:latest
    container_name: eventer-map-ssh
    profiles: ["ssh"]  # 선택적으로만 실행
    ports:
      - "${SSH_PORT:-7774}:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      - USER_NAME=developer
      - SUDO_ACCESS=true
    volumes:
      # 프로젝트 전체를 개발자 홈 디렉토리에 마운트
      - ./:/home/developer/eventer-map:rw
    restart: unless-stopped
    networks:
      - eventer-network

  # ============================================
  # Backend - FastAPI
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventer-map-backend
    ports:
      - "${BACKEND_PORT:-7773}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/eventer.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:7772,http://localhost}
    volumes:
      # 데이터 영속성
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eventer-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Frontend - React + Nginx
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:7773}
        - REACT_APP_GOOGLE_MAPS_API_KEY=${REACT_APP_GOOGLE_MAPS_API_KEY}
    container_name: eventer-map-frontend
    ports:
      - "${FRONTEND_PORT:-7772}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - eventer-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend-data:
    driver: local

networks:
  eventer-network:
    driver: bridge
