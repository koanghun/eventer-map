version: '3.8'

services:
  # ============================================
  # Backend - FastAPI (개발 모드)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: eventer-map-backend-dev
    ports:
      - "${BACKEND_PORT:-65105}:8000"
    environment:
      # Python 로그 설정
      - PYTHONUNBUFFERED=1  # Python 표준 출력 버퍼링 비활성화
      - PYTHONDONTWRITEBYTECODE=1  # .pyc 파일 생성 방지
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/eventer.db}
      # CORS: .env에서 NAS IP 설정 필요
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      # 관리자 설정
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}

    volumes:
      # 코드 Hot Reload를 위한 볼륨 마운트
      - ./backend:/app:rw
      # 데이터 영속성
      - backend-data:/app/data
    restart: unless-stopped
    networks:
      - eventer-network

  # ============================================
  # Frontend - React 개발 서버 (Hot Reload)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: eventer-map-frontend-dev
    ports:
      - "${FRONTEND_PORT:-65104}:3000"
    environment:
      # API URL: .env에서 설정
      - REACT_APP_GOOGLE_MAPS_API_KEY=${REACT_APP_GOOGLE_MAPS_API_KEY}
      - CHOKIDAR_USEPOLLING=true  # Hot reload를 위한 설정
      - WDS_SOCKET_PORT=0
    volumes:
      # 코드 Hot Reload를 위한 볼륨 마운트
      - ./frontend:/app:rw
      # node_modules는 컨테이너 내부 것 사용 (성능 향상)
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - eventer-network
    stdin_open: true
    tty: true

volumes:
  backend-data:
    driver: local

networks:
  eventer-network:
    driver: bridge
