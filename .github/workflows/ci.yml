name: CI Verification

on:
  push:
    branches:
      - main
      - release
      - develop
      - aws-dev
  pull_request:
    branches:
      - main
      - release
      - develop
      - aws-dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/release') }}

jobs:
  backend-ci:
    name: Backend CI (Codegen, Vet, Test, Lambda Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install Codegen Tools (oapi-codegen & sqlc)
        working-directory: backend
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Verify Backend Codegen (oapi-codegen & sqlc)
        working-directory: backend
        run: |
          make generate
          git diff --exit-code internal/handler/openapi.gen.go internal/repository/

      - name: Run Go Vet
        working-directory: backend
        run: go vet ./...

      - name: Run Backend Unit Tests
        working-directory: backend
        run: go test -v -race ./...

      - name: Verify Lambda Binary Build (linux/arm64)
        working-directory: backend
        run: |
          make build
          test -f .build/bootstrap

  frontend-ci:
    name: Frontend CI (Codegen, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Frontend Codegen (Orval)
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code src/api/generated/

      - name: Run TypeScript Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: CI=true npm test -- --watchAll=false

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: CI=true npm run build
